logging:
  level:
    org.springframework.web: DEBUG
server:
  servlet:
    context-path: /sw-springboot
  port: 5000

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, shutdown, prometheus
  endpoint:
    shutdown:
      enabled: true
      health:
        show-details: always
        probes:
          enabled: true
        group:
          readiness:
            include: diskSpace