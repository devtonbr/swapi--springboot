logging:
  level:
    org.springframework.web: DEBUG
server:
  servlet:
    context-path: /sw-springboot
  port: 5000

management:
  server:
    port: 9090
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, shutdown, prometheus
  endpoint:
    shutdown:
      enabled: true
      health:
        show-details: always
        probes:
          enabled: true
        group:
          readiness:
            include: diskSpace

opentracing:
  jaeger:
    http-sender:
      url: http://jaeger-collector.istio-system.svc.cluster.local:14268/api/traces