spring:
  profiles:
    active: dev
  main:
    banner-mode: 'OFF'
info:
  app:
    name: "@project.name@"
    version: "@project.version@"
    description: "@project.description@ "
    base-package: "br.com.swapi.api"

logging:
  level:
    org.springframework.web: DEBUG
server:
  servlet:
    context-path: /sw-springboot
  port: 5000

backend:
  swapi:
    endpoint: ${SWAPI_ENDPOINT:https://swapi.py4e.com/api/films/}

management:
  server:
    port: 9090
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, shutdown, prometheus
  endpoint:
    shutdown:
      enabled: true
    health:
      show-details: always
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACING_ENDPOINT:http://jaeger-collector.istio-system.svc.cluster.local:4318/v1/traces}
  tracing:
    sampling:
      probability: 1.0


