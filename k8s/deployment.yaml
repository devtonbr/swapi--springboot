apiVersion: apps/v1
kind: Deployment
metadata:
  name: swapispringboot-deployment
  namespace: apiexemplo
spec:
  selector:
    matchLabels:
      app: swapispringboot
  template: 
    metadata:
        name: swapispringboot
        labels:
          app: swapispringboot
    spec:
        containers:
          - name: swapispringboot-container
            image: $awsaccountid.dkr.ecr.$awseksregion.amazonaws.com/$awsecrrepository:swapispringboot-$githash
            ports:
              - containerPort: 5000
            livenessProbe:
              httpGet:
                path: /sw-springboot/health
                port: 5000
              initialDelaySeconds: 3
              periodSeconds: 3