apiVersion: apps/v1
kind: Deployment
metadata:
  name: swapispringboot-deployment
  namespace: apiexemplo
spec:
  selector:
    matchLabels:
      app: swapispringboot
  template: 
    metadata:
        name: swapispringboot
        labels:
          app: swapispringboot
    spec:
        containers:
          - name: swapispringboot-container
            image: $awsaccountid.dkr.ecr.us-east-1.amazonaws.com/$awsecrrepository:$artifactory-$githash
            ports:
              - containerPort: 5000