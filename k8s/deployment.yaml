apiVersion: apps/v1
kind: Deployment
metadata:
  name: swapispringboot-deployment
  namespace: apiexemplo
spec:
  selector:
    matchLabels:
      app: swapispringboot
  template: 
    metadata:
        name: swapispringboot
        labels:
          app: swapispringboot
    spec:
        containers:
          - name: swapispringboot-container
            image: 429741560719.dkr.ecr.us-east-1.amazonaws.com/apisexemplo:swapispringboot-latest
            ports:
              - containerPort: 5000
            envFrom:
              - configMapRef: 
                  name: swapispringboot-configmap

